[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-failure-dashboard"
version = "0.1.0"
description = "Reproducible sensor-snapshot failure classification using UCI AI4I."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "PyMySQL[rsa]>=1.1,<2",
  "alembic>=1.13,<2",
  "python-dotenv>=1,<2",
  "streamlit>=1.65,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[project.scripts]
machine-failure-data = "machine_failure.data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
